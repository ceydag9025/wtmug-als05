<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera Çevirmeni</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
</head>
<body>
    <div class="container">
        <header>
            <h1>📷 Kamera Çevirmeni</h1>
            <p>Yazıları anında hedef dilinize çevirin</p>
        </header>

        <!-- Dil Seçimi -->
        <div class="control-group">
            <label for="targetLanguage">Hedef Dil:</label>
            <select id="targetLanguage">
                <option value="tr" selected>Türkçe</option>
                <option value="en">İngilizce</option>
                <option value="de">Almanca</option>
                <option value="fr">Fransızca</option>
                <option value="es">İspanyolca</option>
                <option value="ar">Arapça</option>
                <option value="ru">Rusça</option>
            </select>
        </div>

        <!-- Kamera Alanı -->
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display: none;"></canvas>
            <div class="camera-actions">
                <button id="captureBtn" class="btn primary">📸 Fotoğraf Çek & Çevir</button>
            </div>
        </div>

        <!-- Alternatif Girişler -->
        <div class="alternative-inputs">
            <label for="galleryInput" class="btn secondary">📂 Galeriden Yükle</label>
            <input type="file" id="galleryInput" accept="image/*" style="display: none;">
        </div>

        <!-- Manuel Metin Girişi -->
        <div class="manual-input-group">
            <textarea id="manualText" placeholder="Kamerayla okunamayan metinleri buraya yazabilirsiniz..."></textarea>
            <button id="translateManualBtn" class="btn secondary">✍️ Metni Çevir</button>
        </div>

        <!-- Yükleme / Durum Göstergesi -->
        <div id="status" class="status-message"></div>

        <!-- Sonuç Alanı -->
        <div class="result-container">
            <h3>Algılanan Metin (Kaynak):</h3>
            <p id="sourceText" class="result-box">-</p>

            <h3>Çeviri Sonucu:</h3>
            <p id="translatedText" class="result-box">-</p>
        </div>
    </div>

    <!-- Tesseract.js (On-Device OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
